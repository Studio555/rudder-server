name: Studio555 precision image

on:
  push:
    branches: [studio555/v1.90.0]
  pull_request:
    branches: [studio555/v1.90.0]

permissions:
  contents: read

concurrency:
  group: studio555-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test precision and affected pipeline packages
        run: >-
          go test -p=1 ./internal/integerprecision ./gateway/... ./processor
          ./processor/internal/transformer/user_transformer
          ./processor/internal/transformer/trackingplan_validation
          ./processor/internal/transformer/sourcehydration
          ./processor/internal/transformer/destination_transformer/...
          ./warehouse/slave
      - name: Lint Go and the Studio555 workflow
        run: |
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run
          go run github.com/rhysd/actionlint/cmd/actionlint@latest .github/workflows/studio555-ci.yml
          go run github.com/zricethezav/gitleaks/v8@v8.21.2 detect --redact --log-opts=9b06b87c9c0560fc5271d1872a5bc572cd3c1d62..HEAD
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOCAL_IMAGE: rudder-server:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/Studio555/rudder-server
            org.opencontainers.image.revision=${{ github.sha }}
            io.studio555.upstream-base=v1.90.0
          build-args: |
            VERSION=1.90.0-studio555
            COMMIT_HASH=${{ github.sha }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=studio555-rudder-server
          cache-to: type=gha,mode=max,scope=studio555-rudder-server
      - name: Smoke test runtime
        run: docker run --rm --entrypoint /bin/sh "$LOCAL_IMAGE" -c 'test -x /rudder-server && pg_isready --version && psql --version'
      - run: docker save "$LOCAL_IMAGE" | gzip > tested-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tested-service-image
          path: tested-image.tar.gz
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: image
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/studio555/v1.90.0' &&
      vars.GCP_IMAGE_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_IMAGE_PUBLISHER_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      LOCAL_IMAGE: rudder-server:${{ github.sha }}
      REGISTRY_IMAGE: europe-north1-docker.pkg.dev/s555-devservices-shared/docker/rudder-server:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tested-service-image
      - run: docker load -i tested-image.tar.gz
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_IMAGE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_IMAGE_PUBLISHER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker europe-north1-docker.pkg.dev --quiet
      - run: docker tag "$LOCAL_IMAGE" "$REGISTRY_IMAGE"
      - run: docker push "$REGISTRY_IMAGE"
      - name: Record deployment digest
        run: |
          docker inspect "$REGISTRY_IMAGE" --format '{{json .RepoDigests}}' > deployment-digests.json
          printf '%s\n' "$GITHUB_SHA" > source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-image
          path: |
            deployment-digests.json
            source-commit.txt
          retention-days: 90
          if-no-files-found: error
